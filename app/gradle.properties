# ============================================================================
#  本项目的 Gradle 配置
#
#  ⚠️ 这个项目要和机器上其他 Android 工程共用同一套工具链
#     （同一个 JDK、同一个 C:\Android SDK、同一个 Gradle 8.9 发行版）。
#     所以下面刻意做了隔离，避免抢资源或互相污染：
#
#    - 守护进程加空闲超时：构建完几分钟就自己退出，不会长期占 2GB 内存躺着。
#      （踩过一次：守护进程存活时占了 2324 MB，把可用内存压到 3.6 GB）
#    - SDK 路径走工程内的 local.properties，不依赖系统环境变量，
#      所以不会影响别的工程怎么找 SDK。
#    - 不写 org.gradle.java.home，用系统 JAVA_HOME，与别的工程一致。
#    - 依赖缓存是共享的（~/.gradle/caches），这是 Gradle 的正常设计：
#      同名同版本依赖只会存一份，不会冲突。Gradle 自己有文件锁保护，
#      两个工程同时构建也安全。
#
#  改这个文件前先想一下会不会影响别的工程。
# ============================================================================

# 堆上限 2GB。Android 构建够用，也不至于把机器吃干。
# ⚠️ 这个值刻意与 D:\dsh\aibendi 的 -Xmx4096m 不同：Gradle 按 jvmargs 匹配
#    守护进程，值不同就会各起一个，两个工程互不抢内存、互不影响。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 空闲 3 分钟就退出守护进程 —— 这是本文件里最重要的一条。
# 默认是 3 小时，会让一个 2GB 的 java 进程长期挂着。
org.gradle.daemon.idletimeout=180000

org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
